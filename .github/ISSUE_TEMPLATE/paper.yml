name: Add a paper
description: Suggest a paper for the reading list
title: "[Paper] "
labels:
  - paper
body:
  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Exact title from the paper
    validations:
      required: true
  - type: input
    id: paper
    attributes:
      label: Primary paper URL
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: publication
    attributes:
      label: Date and venue / status
      description: Use YYYY-MM and an exact venue, arXiv preprint, or under review.
      placeholder: 2026-08 · arXiv preprint
    validations:
      required: true
  - type: dropdown
    id: track
    attributes:
      label: Track
      options:
        - Multi-reference image generation
        - Agentic image generation
        - Direct intersection
        - Foundation / adjacent bridge
    validations:
      required: true
  - type: input
    id: resources
    attributes:
      label: Official project or code URL
      description: Include only author- or organization-maintained artifacts.
      placeholder: "Project: https://... · Code: https://github.com/author/project"
  - type: textarea
    id: relevance
    attributes:
      label: Why it belongs
      description: Briefly explain how it satisfies the selected track.
    validations:
      required: true
  - type: textarea
    id: intersection_evidence
    attributes:
      label: Intersection evidence
      description: Required only for Direct intersection. State separate evidence for the multi-reference and agentic axes.
      placeholder: "Multi-reference: ...\nAgentic: ..."
  - type: checkboxes
    id: checks
    attributes:
      label: Submission checks
      options:
        - label: I searched the repository for duplicate titles, aliases, and identifiers.
          required: true
        - label: The title, venue/status, and artifact links come from primary or official sources.
          required: true
